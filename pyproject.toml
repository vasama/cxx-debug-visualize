[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "test_visualizers"
version = "0.1.0"
description = "Unit tests for natvis files, run through VS Code's C/C++ debug adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
test_visualizers = "test_visualizers.cli:main"

[tool.setuptools]
packages = ["test_visualizers"]
