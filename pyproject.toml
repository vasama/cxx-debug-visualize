[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "cxx-vistest"
version = "0.1.0"
description = "Unit tests for natvis files and gdb pretty printers, run through VS Code's C/C++ debug adapter"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
cxx-vistest = "cxx_vistest.cli:main"

[tool.setuptools]
packages = ["cxx_vistest"]
