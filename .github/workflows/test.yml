name: test

on:
  push:
  pull_request:

env:
  # The MIEngine commit OpenDebugAD7 is built from main as of 2026-09-22. MIEngine's version tags
  # stopped at v1.19.6 (2024), while the C/C++ extension ships builds of main.
  MIENGINE_REF: fdd455222c3233daf55143b027870639e13f7108

  # The .NET SDK version used for building MIEngine.
  MIENGINE_DOTNET_SDK: "10.0.x"

  # The lldb-tools/lldb-mi commit lldb-mi is built from: main as of 2026-04-09, as it has no
  # releases. It is built against the image's LLVM 18, whose lldb-dap is tested too.
  LLDB_MI_REF: 1aa9e8fa609d7118dd8f0cb2c79e6cee9a53aeac

  # Version and hash of the Microsoft.Debugging.Platform.DbgEng NuGet package, which provides the
  # DbgEng headers and dll.
  DBGENG_VERSION: "20260319.1511.0"
  DBGENG_SHA256: 875678516f9ceed4a1c8b9b106d165106fcaa38723ad7c584c47b95b231600de

jobs:
  # Fails if `ruff format` would change any Python code, or `ruff check` reports anything (both
  # configured in pyproject.toml). Ruff is pinned, since its formatting and rules can change
  # between versions.
  ruff:
    name: Check formatting and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          args: format --check --diff
      - uses: astral-sh/ruff-action@v4.1.0
        if: ${{ !cancelled() }}
        with:
          version: "0.16.9"
          args: check

  # Type-checks the package (not the self-tests) with mypy, under the oldest supported Python, so
  # that it is checked against that version's standard library. mypy is pinned, since its checks
  # can change between versions.
  mypy:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install mypy==2.3.1
      - run: mypy cxx_debug_visualize

  # Builds OpenDebugAD7 (self-contained) from the MIT-licensed MIEngine sources, only when the
  # cache has no build of MIENGINE_REF with MIENGINE_DOTNET_SDK yet.
  adapter:
    name: Build OpenDebugAD7
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/miengine
          key: miengine-${{ runner.os }}-${{ env.MIENGINE_REF }}-dotnet-${{ env.MIENGINE_DOTNET_SDK }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: microsoft/MIEngine
          ref: ${{ env.MIENGINE_REF }}
          path: MIEngine
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.MIENGINE_DOTNET_SDK }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: sh MIEngine/PublishOpenDebugAD7.sh -c Release -o "$RUNNER_TEMP/miengine"

  # Builds lldb-mi, LLDB's implementation of gdb's machine interface for OpenDebugAD7, from the
  # lldb-mi sources, only when the cache has no build of LLDB_MI_REF yet.
  lldb-mi:
    name: Build lldb-mi
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/lldb-mi
          key: lldb-mi-${{ runner.os }}-${{ env.LLDB_MI_REF }}-llvm-18
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: lldb-tools/lldb-mi
          ref: ${{ env.LLDB_MI_REF }}
          path: lldb-mi
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm-18-dev liblldb-18-dev

          cmake -S lldb-mi -B lldb-mi/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          cmake --build lldb-mi/build --parallel

          mkdir -p "$RUNNER_TEMP/lldb-mi"
          cp lldb-mi/build/src/lldb-mi "$RUNNER_TEMP/lldb-mi/"

  test-linux:
    name: Linux - Python ${{ matrix.python }}
    needs: [adapter, lldb-mi]
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - id: python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          update-environment: false

      - name: Install gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/miengine
          key: miengine-${{ runner.os }}-${{ env.MIENGINE_REF }}-dotnet-${{ env.MIENGINE_DOTNET_SDK }}
          fail-on-cache-miss: true

      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/lldb-mi
          key: lldb-mi-${{ runner.os }}-${{ env.LLDB_MI_REF }}-llvm-18
          fail-on-cache-miss: true

      - name: Build and run tests
        env:
          # Ubuntu's LLDB finds lldb-server only next to the program using it, as lldb-dap has
          # it but the lldb-mi built here does not.
          LLDB_DEBUGSERVER_PATH: /usr/lib/llvm-18/bin/lldb-server
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DPython3_EXECUTABLE="${{ steps.python.outputs.python-path }}" \
            -DCXXDEBVIS_GDB=gdb \
            -DCXXDEBVIS_LLDB_DAP=lldb-dap-18 \
            -DCXXDEBVIS_LLDB_MI="$RUNNER_TEMP/lldb-mi/lldb-mi" \
            -DCXXDEBVIS_MIENGINE="$RUNNER_TEMP/miengine/OpenDebugAD7"

          cmake --build build
          ctest --test-dir build --output-on-failure

  # On Windows only the DbgEng debugger and the custom adapter are tested.
  test-windows:
    name: Windows
    runs-on: windows-2025
    steps:
      - name: Download DbgEng
        run: |
          $name = "microsoft.debugging.platform.dbgeng"
          $version = $env:DBGENG_VERSION
          $package = Join-Path $env:RUNNER_TEMP dbgeng.nupkg
          $url = "https://api.nuget.org/v3-flatcontainer/$name/$version/$name.$version.nupkg"
          Invoke-WebRequest -Uri $url -OutFile $package
          if ((Get-FileHash $package -Algorithm SHA256).Hash -ne $env:DBGENG_SHA256) {
            throw "$name $version does not have the expected SHA-256"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $destination = Join-Path $env:RUNNER_TEMP dbgeng
          [System.IO.Compression.ZipFile]::ExtractToDirectory($package, $destination)

      - uses: actions/checkout@v7

      - name: Build and run tests
        run: |
          $PSNativeCommandUseErrorActionPreference = $true

          cmake -S . -B build "-DDbgEng_ROOT=$env:RUNNER_TEMP\dbgeng"
          cmake --build build --config Debug
          ctest --test-dir build -C Debug --output-on-failure
