name: test

on:
  push:
  pull_request:

env:
  # The MIEngine commit OpenDebugAD7 is built from main as of 2026-09-22. MIEngine's version tags
  # stopped at v1.19.6 (2024), while the C/C++ extension ships builds of main.
  MIENGINE_REF: fdd455222c3233daf55143b027870639e13f7108

  # The .NET SDK version used for building MIEngine.
  MIENGINE_DOTNET_SDK: "10.0.x"

jobs:
  # Fails if `ruff format` would change any Python code, or `ruff check` reports anything (both
  # configured in pyproject.toml). Ruff is pinned, since its formatting and rules can change
  # between versions.
  ruff:
    name: Check formatting and lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v4.1.0
        with:
          version: "0.16.9"
          args: format --check --diff
      - uses: astral-sh/ruff-action@v4.1.0
        if: ${{ !cancelled() }}
        with:
          version: "0.16.9"
          args: check

  # Type-checks the package (not the self-tests) with mypy, under the oldest supported Python, so
  # that it is checked against that version's standard library. mypy is pinned, since its checks
  # can change between versions.
  mypy:
    name: Type check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.10"
      - run: pip install mypy==2.3.1
      - run: mypy cxx_debug_visualize

  # Builds OpenDebugAD7 (self-contained) from the MIT-licensed MIEngine sources, only when the
  # cache has no build of MIENGINE_REF with MIENGINE_DOTNET_SDK yet.
  adapter:
    name: Build OpenDebugAD7
    runs-on: ubuntu-24.04
    steps:
      - id: cache
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/miengine
          key: miengine-${{ runner.os }}-${{ env.MIENGINE_REF }}-dotnet-${{ env.MIENGINE_DOTNET_SDK }}
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v7
        with:
          repository: microsoft/MIEngine
          ref: ${{ env.MIENGINE_REF }}
          path: MIEngine
          persist-credentials: false
      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.MIENGINE_DOTNET_SDK }}
      - if: steps.cache.outputs.cache-hit != 'true'
        env:
          DOTNET_CLI_TELEMETRY_OPTOUT: 1
          DOTNET_NOLOGO: 1
        run: sh MIEngine/PublishOpenDebugAD7.sh -c Release -o "$RUNNER_TEMP/miengine"

  test:
    name: Linux - Python ${{ matrix.python }}
    needs: adapter
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: Install gdb
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb

      - uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/miengine
          key: miengine-${{ runner.os }}-${{ env.MIENGINE_REF }}-dotnet-${{ env.MIENGINE_DOTNET_SDK }}
          fail-on-cache-miss: true

      - name: Build and run tests
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCXXDEBVIS_GDB=gdb \
            -DCXXDEBVIS_LLDB_DAP=lldb-dap-18 \
            -DCXXDEBVIS_MIENGINE="$RUNNER_TEMP/miengine/OpenDebugAD7"

          cmake --build build
          ctest --test-dir build --output-on-failure
